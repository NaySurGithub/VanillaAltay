name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build phar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          ini-values: phar.readonly=0

      - name: Read the plugin version
        id: plugin
        run: |
          echo "version=$(sed -n 's/^version:[[:space:]]*//p' plugin.yml)" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.plugin.outputs.version }}" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin.yml version ${{ steps.plugin.outputs.version }}"
            exit 1
          fi

      - name: Lint the sources
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Fetch DevTools
        run: curl -sSfL -o ConsoleScript.php https://raw.githubusercontent.com/pmmp/DevTools/master/src/ConsoleScript.php

      - name: Build the phar
        run: |
          # DevTools embeds the whole folder, so stage only what the plugin ships
          mkdir stage
          cp plugin.yml stage/
          cp -r src resources stage/
          # --make resolves against --relative, so build from inside the staged folder
          cd stage
          php ../ConsoleScript.php --make . --relative . --out ../VanillaAltay.phar

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanillaAltay-${{ steps.plugin.outputs.version }}
          path: VanillaAltay.phar

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VanillaAltay ${{ steps.plugin.outputs.version }}
          files: VanillaAltay.phar
          generate_release_notes: true
